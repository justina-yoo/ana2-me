[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  function = "og-inject"
  path = "/"

[[edge_functions]]
  function = "og-inject"
  path = "/insights"

[[edge_functions]]
  function = "og-inject"
  path = "/insights/"

[[edge_functions]]
  function = "og-inject"
  path = "/article/*"

[[edge_functions]]
  function = "og-inject"
  path = "/brands"

[[edge_functions]]
  function = "og-inject"
  path = "/brands/*"

[[edge_functions]]
  function = "og-inject"
  path = "/ingredients/*"

[[edge_functions]]
  function = "og-inject"
  path = "/products"

[[edge_functions]]
  function = "og-inject"
  path = "/products/"

[[edge_functions]]
  function = "og-inject"
  path = "/products/*"

[[edge_functions]]
  function = "og-inject"
  path = "/about"

[[edge_functions]]
  function = "og-inject"
  path = "/about/"

[[edge_functions]]
  function = "og-inject"
  path = "/analyzer"

[[edge_functions]]
  function = "og-inject"
  path = "/analyzer/"

[[edge_functions]]
  function = "og-inject"
  path = "/privacy"

[[edge_functions]]
  function = "og-inject"
  path = "/privacy/"

[[edge_functions]]
  function = "og-inject"
  path = "/terms"

[[edge_functions]]
  function = "og-inject"
  path = "/terms/"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
