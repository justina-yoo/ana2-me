  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "fontPair": "sourceserif-inter",
      "headerStyle": "friendly",
      "density": "cozy",
      "accent": "forest",
      "night": false
    }/*EDITMODE-END*/;

    const FONT_PAIRS = {
      'sourceserif-inter': { display: "'Source Serif 4', Georgia, serif", text: "'Inter', system-ui, sans-serif", label: 'Source Serif · Inter' },
      'newsreader-inter':  { display: "'Newsreader', Georgia, serif", text: "'Inter', system-ui, sans-serif", label: 'Newsreader · Inter' },
      'sourceserif-plex':  { display: "'Source Serif 4', Georgia, serif", text: "'IBM Plex Sans', system-ui, sans-serif", label: 'Source Serif · Plex' },
    };

    const ACCENTS = {
      forest:    { hex: '#2d5a3d', label: 'Forest' },
      clay:      { hex: '#a44a3f', label: 'Clay' },
      indigo:    { hex: '#2e3d8f', label: 'Indigo' },
      plum:      { hex: '#6b3a5c', label: 'Plum' },
      ink:       { hex: '#1a1916', label: 'Ink' },
    };

    function Tweaks({ tweaks, setTweak, lang, setLang }) {
      const t = window.useL(lang);
      return (
        <aside className="tweaks">
          <h4>Tweaks <Sticker color="butter" rotate={-4}>live</Sticker></h4>

          <div className="tweak-row">
            <label>{t('Font pair', '폰트 조합')}</label>
            <div className="tweak-opts">
              {Object.entries(FONT_PAIRS).map(([k, v]) => (
                <button key={k} className={cn('tweak-opt', tweaks.fontPair === k && 'tweak-opt-on')} onClick={() => setTweak('fontPair', k)}>
                  {v.label}
                </button>
              ))}
            </div>
          </div>

          <div className="tweak-row">
            <label>{t('Header style', '헤더 스타일')}</label>
            <div className="tweak-opts">
              {['friendly', 'editorial'].map(o => (
                <button key={o} className={cn('tweak-opt', tweaks.headerStyle === o && 'tweak-opt-on')} onClick={() => setTweak('headerStyle', o)}>
                  {o}
                </button>
              ))}
            </div>
          </div>

          <div className="tweak-row">
            <label>{t('Density', '여백')}</label>
            <div className="tweak-opts">
              {['snug', 'cozy', 'airy'].map(o => (
                <button key={o} className={cn('tweak-opt', tweaks.density === o && 'tweak-opt-on')} onClick={() => setTweak('density', o)}>
                  {o}
                </button>
              ))}
            </div>
          </div>

          <div className="tweak-row">
            <label>{t('Accent', '강조색')}</label>
            <div className="tweak-swatch">
              {Object.entries(ACCENTS).map(([k, v]) => (
                <button
                  key={k}
                  className={cn('tweak-swatch-btn', tweaks.accent === k && 'on')}
                  style={{ background: v.hex }}
                  title={v.label}
                  onClick={() => setTweak('accent', k)}
                />
              ))}
            </div>
          </div>

          <div className="tweak-row">
            <label>{t('Mode', '모드')}</label>
            <div className="tweak-opts">
              <button className={cn('tweak-opt', !tweaks.night && 'tweak-opt-on')} onClick={() => setTweak('night', false)}>day</button>
              <button className={cn('tweak-opt', tweaks.night && 'tweak-opt-on')} onClick={() => setTweak('night', true)}>night</button>
            </div>
          </div>
        </aside>
      );
    }

    function App() {
      // Persistent UI state
      const [view, setView] = window.useLocalState('view', 'insights'); // feed | detail | insights | analyzer
      const [category, setCategory] = window.useLocalState('cat', 'skincare');
      const [productId, setProductId] = window.useLocalState('pid', null);
      const [query, setQuery] = window.useLocalState('q', '');
      const detectedLang = (navigator.languages || [navigator.language]).some(l => l.startsWith('ko')) ? 'ko' : 'en';
      const [lang, setLang] = window.useLocalState('lang', detectedLang);

      const product = productId ? window.PRODUCTS.find(p => p.id === productId) : null;
      const setProduct = (p) => {
        setProductId(p ? p.id : null);
        setView(p ? 'detail' : 'feed');
      };

      // Tweaks
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [tweaksOpen, setTweaksOpen] = useState(false);

      const setTweak = (k, v) => {
        const next = { ...tweaks, [k]: v };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      };

      // Handle direct URL navigation (e.g. /about, /insights)
      useEffect(() => {
        const path = window.location.pathname.replace(/\/$/, '');
        if (path === '' || path === '/insights') {
          setView('insights'); if (window.SEO) window.SEO.setHome();
        }
        else if (path === '/analyzer') { setView('analyzer'); if (window.SEO) window.SEO.setAnalyzer(); }
        else if (path === '/about') { setView('about'); if (window.SEO) window.SEO.setAbout(); }
        else if (path === '/privacy') { setView('privacy'); if (window.SEO) window.SEO.setPrivacy(); }
      }, []);

      // Update SEO meta on view changes (for non-article views)
      useEffect(() => {
        if (!window.SEO) return;
        if (view === 'privacy') window.SEO.setPrivacy();
        if (view === 'analyzer') window.SEO.setAnalyzer();
      }, [view]);

      // Edit-mode protocol
      useEffect(() => {
        const onMsg = (e) => {
          if (!e.data || typeof e.data !== 'object') return;
          if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
          if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      // Apply tweaks to CSS vars
      useEffect(() => {
        const fp = FONT_PAIRS[tweaks.fontPair] || FONT_PAIRS['sourceserif-inter'];
        document.documentElement.style.setProperty('--font-display', fp.display);
        document.documentElement.style.setProperty('--font-text', fp.text);
        const accent = ACCENTS[tweaks.accent] || ACCENTS.forest;
        document.documentElement.style.setProperty('--accent', accent.hex);
        document.body.classList.toggle('night', !!tweaks.night);
      }, [tweaks]);

      // Apply lang class for Korean word-break
      useEffect(() => {
        document.documentElement.classList.toggle('lang-ko', lang === 'ko');
      }, [lang]);

      const showHeader = true;
      const density = tweaks.density;

      return (
        <div className="app" data-screen-label={`${view}`}>
          {showHeader && (
            <Header
              lang={lang} setLang={setLang}
              view={view} setView={setView}
              category={category} setCategory={setCategory}
              query={query} setQuery={setQuery}
              density={density}
              headerStyle={tweaks.headerStyle}
            />
          )}
          {view === 'feed' && <Feed lang={lang} category={category} query={query} setView={setView} setProduct={setProduct} density={density} />}
          {view === 'detail' && product && <Detail product={product} lang={lang} setView={setView} setProduct={setProduct} density={density} />}
          {view === 'insights' && <Insights lang={lang} density={density} query={query} />}
          {view === 'analyzer' && <Analyzer lang={lang} density={density} />}
          {view === 'about' && <About lang={lang} density={density} />}
          {view === 'privacy' && <Privacy lang={lang} />}

          <footer style={{ maxWidth: 1180, margin: '0 auto', padding: '32px 28px 48px', borderTop: '1px solid var(--line)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
            <span style={{ fontSize: 13, color: 'var(--ink-faint)' }}>© {new Date().getFullYear()} ana2me</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
              <button onClick={() => setView('privacy')} style={{ fontSize: 13, color: 'var(--ink-faint)', background: 'none', border: 'none', cursor: 'pointer', padding: 0, textDecoration: 'underline', textUnderlineOffset: 3 }}>
                {lang === 'ko' ? '개인정보처리방침' : 'Privacy Policy'}
              </button>
              <button onClick={() => setLang(lang === 'ko' ? 'en' : 'ko')} style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-faint)', background: 'none', border: 'none', cursor: 'pointer', padding: 0, letterSpacing: '0.04em' }}>
                {lang === 'ko' ? 'EN' : '한국어'}
              </button>
            </div>
          </footer>

          {tweaksOpen && <Tweaks tweaks={tweaks} setTweak={setTweak} lang={lang} setLang={setLang} />}
        </div>
      );
    }

    // setProduct hook: when called with a product, also navigate to detail.
    // We patch here by wrapping setProduct... actually simpler to handle inside child via setView.
    // The Feed/Detail components already call setProduct; ensure view follows.
    // (Handled via a small effect inside App via wrapping setProduct)

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
